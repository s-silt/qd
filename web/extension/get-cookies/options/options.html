<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>__MSG_optionsTitle__</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; padding: 14px; min-width: 360px; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 120px; font-family: monospace; font-size: 12px; padding: 6px; }
    .help { color: #666; font-size: 12px; margin: 4px 0 8px; line-height: 1.5; }
    .actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    button { padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .status { font-size: 12px; color: #2a8a3e; }
    .status.error { color: #c0392b; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>
  <label for="hosts" data-i18n="optionsHostsLabel"></label>
  <textarea id="hosts" placeholder="http://192.168.1.10:8923&#10;https://qd.example.com" spellcheck="false"></textarea>
  <p class="help" data-i18n="optionsHostsHelp"></p>
  <div class="actions">
    <button id="save" data-i18n="optionsSave"></button>
    <button id="reset" data-i18n="optionsReset"></button>
    <span id="status" class="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
