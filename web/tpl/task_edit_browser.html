<form method="POST" action="/task/{{ task.id }}/edit">
  <h2 class="text-center">修改任务</h2>
  <hr>
  <div class="form-group">
    <label>使用模板</label>
    <p><a href="/tpl/{{ tpl.id }}/edit">{{ tpl.sitename }}</a> · <a href="/ai-workbench/?task={{ task.id }}">更新登录</a></p>
  </div>
  <div class="form-group">
    <label for="browser-task-note">备注</label>
    <input class="form-control" id="browser-task-note" name="_binux_note" value="{{ task.note or '' }}" maxlength="256">
  </div>
  <div class="form-group">
    <label for="browser-task-retries">重试次数</label>
    <input class="form-control" id="browser-task-retries" name="_binux_retry_count" type="number" min="-1" max="{{ default_retry_count }}" value="{{ task.retry_count }}" required>
    <p class="help-block">-1 表示持续重试，0 表示不重试。站点要求验证时会暂停任务。</p>
  </div>
  <div class="form-group">
    <label for="browser-task-retry-interval">重试间隔（秒）</label>
    <input class="form-control" id="browser-task-retry-interval" name="_binux_retry_interval" type="number" min="60" max="31536000" value="{{ task.retry_interval or '' }}" placeholder="默认退避间隔">
  </div>
  <div class="text-right">
    <a class="btn btn-default" data-method="POST" href="/task/{{ task.id }}/disable" data-confirm="是否禁用任务？">禁用</a>
    <button class="btn btn-primary" type="submit">保存</button>
  </div>
</form>
