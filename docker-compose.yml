services:
  qd:
    build: .
    container_name: qd
    depends_on:
      - redis
    ports:
      - "8923:80"
    volumes:
      - "./config:/usr/src/app/config"
    shm_size: 1gb  # Playwright 需要共享内存
    environment:
      - DOMAIN=
      - COOKIE_SECRET=binux
      - PBKDF2_ITERATIONS=600000
      - AES_KEY=binux
      - REDISCLOUD_URL=redis://redis:6379
      # Playwright 配置
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_MAX_CONCURRENT=2
      - PLAYWRIGHT_DEFAULT_TIMEOUT_MS=60000
      # - PLAYWRIGHT_ALLOW_HOSTS=example.com,foo.com  # 白名单，防 SSRF
      # AI 辅助签到
      # - AI_API_KEY=
      # - AI_BASE_URL=https://api.openai.com/v1
      # - AI_MODEL=gpt-4o-mini
      # - AI_TIMEOUT=60

  redis:
    image: redis:alpine
    container_name: redis
    command: ["--loglevel warning"]
    volumes:
      - ./redis/data:/data:rw
