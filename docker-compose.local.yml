# docker-compose for s-silt/qd fork
# 使用本地 fork 源码构建镜像, 而非拉取官方预编译镜像。
# 用法: docker compose -f docker-compose.local.yml up -d --build

services:
  qd:
    build:
      context: .
      dockerfile: Dockerfile
    image: s-silt/qd:local
    container_name: qd
    depends_on:
      - redis
    ports:
      - "8923:80"
    volumes:
      - "./config:/usr/src/app/config"
    shm_size: 1gb  # Playwright 需要共享内存
    environment:
      # === 基础设置（生产环境务必修改下面三项）===
      - DOMAIN=
      - COOKIE_SECRET=${COOKIE_SECRET:-}
      # Preserve the existing encryption key for installations created with this file.
      - AES_KEY=${AES_KEY:-please-change-to-a-long-random-string}

      # === Redis ===
      - REDISCLOUD_URL=redis://redis:6379

      # === Playwright 内置抓包配置 ===
      - PLAYWRIGHT_HEADLESS=true
      - PLAYWRIGHT_MAX_CONCURRENT=2
      - PLAYWRIGHT_DEFAULT_TIMEOUT_MS=60000
      # - PLAYWRIGHT_ALLOW_HOSTS=example.com,foo.com  # 白名单，防 SSRF

      # === AI 辅助签到模板生成（兼容 OpenAI 协议）===
      # 在 .env 中设置模型的地址、名称与认证方式
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_ALLOW_NO_KEY=${AI_ALLOW_NO_KEY:-false}
      - AI_WORKBENCH_BROWSER=${AI_WORKBENCH_BROWSER:-false}
      # - AI_TIMEOUT=60
      # - AI_MAX_HAR_ENTRIES=60

      # === 其他常用项（按需启用）===
      # - QD_DEBUG=False
      # - MULTI_PROCESS=False
      # - DB_TYPE=sqlite3
      # - JAWSDB_MARIA_URL=mysql://user:pass@mysql:3306/qd?auth_plugin=
      # - WORKER_METHOD=Queue
      # - QUEUE_NUM=50
      # - PUSH_BATCH_SW=True
      # - MAIL_SMTP=
      # - MAIL_USER=
      # - MAIL_PASSWORD=
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    command: ["--loglevel", "warning"]
    volumes:
      - ./redis/data:/data:rw
    restart: unless-stopped
