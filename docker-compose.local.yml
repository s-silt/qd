# docker-compose for s-silt/qd fork
# 使用本地 fork 源码构建镜像, 而非拉取官方预编译镜像。
# 用法: docker compose -f docker-compose.local.yml up -d --build

services:
  qd:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: s-silt/qd:local
    container_name: qd
    depends_on:
      - redis
    ports:
      - "8923:80"
    volumes:
      - "./config:/usr/src/app/config"
    environment:
      # === Web 框架选择 ===
      # 默认启动 FastAPI (uvicorn)。切换为 Tornado 旧版服务：
      # - WEB_FRAMEWORK=fastapi   # 默认，无需显式设置
      # - WEB_FRAMEWORK=tornado   # 切换为 Tornado

      # === 基础设置（生产环境务必修改下面三项）===
      - DOMAIN=
      - COOKIE_SECRET=please-change-to-a-long-random-string
      - AES_KEY=please-change-to-a-long-random-string

      # === Redis ===
      - REDISCLOUD_URL=redis://redis:6379

      # === AI 辅助签到模板生成（兼容 OpenAI 协议）===
      # 取消注释并填入 API Key 即可启用 HAR 编辑器右上角 "AI 智能识别签到" 按钮
      # - AI_API_KEY=sk-xxxxxxxxxxxxxxxx
      # - AI_BASE_URL=https://api.deepseek.com/v1
      # - AI_MODEL=deepseek-chat
      # - AI_TIMEOUT=60
      # - AI_MAX_HAR_ENTRIES=60

      # === URL 自动抓包（Playwright sidecar）===
      # 启用下方 playwright 服务后取消下行注释, 即可在 HAR 编辑器
      # 使用 "URL 自动抓包" 按钮, 配合 Cookie/storage_state 自动录 HAR
      # - PLAYWRIGHT_SIDECAR_URL=http://playwright:8924
      # - PLAYWRIGHT_CAPTURE_TIMEOUT=120

      # === 其他常用项（按需启用）===
      # - QD_DEBUG=False
      # - MULTI_PROCESS=False
      # - DB_TYPE=sqlite3
      # - JAWSDB_MARIA_URL=mysql://user:pass@mysql:3306/qd?auth_plugin=
      # - WORKER_METHOD=Queue
      # - QUEUE_NUM=50
      # - PUSH_BATCH_SW=True
      # - MAIL_SMTP=
      # - MAIL_USER=
      # - MAIL_PASSWORD=
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    command: ["--loglevel", "warning"]
    volumes:
      - ./redis/data:/data:rw
    restart: unless-stopped

  # ─── URL 自动抓包 sidecar (二选一) ────────────────────────────────
  # 两个版本接口完全兼容, QD 主端用 PLAYWRIGHT_SIDECAR_URL 选择即可。
  # 默认启用 Python 版 (功能最完整), 想用更轻量的 Go 版就改 QD 的
  # PLAYWRIGHT_SIDECAR_URL=http://playwright-go:8924, 把 playwright 段
  # 注释掉, 取消 playwright-go 段的注释。

  # Playwright Python 版 - 镜像约 1.5GB, 完整 HAR 字段, 支持 locale/timezone
  playwright:
    build:
      context: ./services/playwright
      dockerfile: Dockerfile
    image: s-silt/qd-playwright:local
    container_name: qd-playwright
    environment:
      - HEADLESS=true
      - MAX_CONCURRENT=2
      - DEFAULT_TIMEOUT_MS=60000
      # - ALLOW_HOSTS=example.com,foo.com
    shm_size: 1gb
    expose:
      - "8924"
    restart: unless-stopped

  # Playwright Go 版 - 镜像约 250MB, 启动快, HAR 字段稍简
  # 想用 Go 版: 取消注释, 同时把上面 playwright 段注释掉
  # playwright-go:
  #   build:
  #     context: ./services/playwright-go
  #     dockerfile: Dockerfile
  #   image: s-silt/qd-playwright-go:local
  #   container_name: qd-playwright-go
  #   environment:
  #     - HEADLESS=true
  #     - MAX_CONCURRENT=2
  #     - DEFAULT_TIMEOUT_MS=60000
  #     # - ALLOW_HOSTS=example.com,foo.com
  #   shm_size: 1gb
  #   expose:
  #     - "8924"
  #   restart: unless-stopped
