name: ChangeRelease
# Disabled: this fork publishes releases via `gh release` / tags.
# dropseed/changerelease fails on historical CHANGELOG versions that have no git tags.
on:
  workflow_dispatch: {}

jobs:
  sync:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: dropseed/changerelease@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_prefix: ""
        changelog: CHANGELOG.md
