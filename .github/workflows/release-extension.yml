name: Release Get-Cookies Extension

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under (e.g. extension-v3.0.0). Leave blank to use the manifest version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build extension zip and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build extension zip
        id: build
        run: |
          bash scripts/build-extension.sh
          ZIP="$(ls dist/qd-get-cookies-v*.zip | head -n1)"
          VERSION="$(python3 -c "import json; print(json.load(open('web/extension/get-cookies/manifest.json'))['version'])")"
          SHA256="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          SIZE="$(wc -c < "$ZIP")"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          {
            echo "## QD Cookies Helper v$VERSION"
            echo ""
            echo "Manifest V3 浏览器扩展，用于在已登录目标站点上一键导出 cookie 并通过 \`postMessage\` 发送给 QD 框架。源码位于 [\`web/extension/get-cookies/\`](web/extension/get-cookies/)。"
            echo ""
            echo "### 安装"
            echo ""
            echo "1. 下载下方的 \`qd-get-cookies-v$VERSION.zip\` 并解压"
            echo "2. 打开 Chromium 系浏览器扩展页（Chrome：\`chrome://extensions/\`），开启开发者模式"
            echo "3. 点 **加载已解压的扩展程序**，选择解压目录"
            echo "4. 装好后点扩展图标 → **选项**，把你的 QD 站点加入白名单（每行一个）"
            echo "5. 在已登录目标签到站点的浏览器里，回到 QD 测试面板点「获取」即可"
            echo ""
            echo "QD 自身页面 \`/get-cookies/\` 也提供同样的 zip + bookmarklet 替代方案。"
            echo ""
            echo "### 校验"
            echo ""
            echo "\`\`\`"
            echo "size   : $SIZE bytes"
            echo "sha256 : $SHA256"
            echo "\`\`\`"
            echo ""
            echo "构建脚本 [\`scripts/build-extension.sh\`](scripts/build-extension.sh) 是字节确定性的——任何人在本仓库同 commit 上重新跑一遍都会得到同样的 sha256。"
            echo ""
            echo "### 与上游 [qd-today/get-cookies](https://github.com/qd-today/get-cookies) 的差异"
            echo ""
            echo "见 [web/extension/get-cookies/README.md](web/extension/get-cookies/README.md#与上游-qd-todayget-cookies-的差异)。"
          } > release_notes.md

      - name: Determine tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=extension-v${{ steps.build.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: QD Cookies Helper ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          files: ${{ steps.build.outputs.zip }}
          fail_on_unmatched_files: true
